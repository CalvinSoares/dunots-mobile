<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B1316" />
  <title>Dunots — Protótipo de produto</title>
  <style>
    :root {
      --background: #0B1316;
      --surface: #122021;
      --surface-pressed: #182A2B;
      --border: #29403B;
      --border-soft: rgba(202, 225, 211, .13);
      --text: #F0F4EE;
      --text-muted: #A5B1AA;
      --action: #49D17D;
      --complete: #A8D5BA;
      --review: #E8C56A;
      --special: #B9A1F5;
      --danger: #FF8278;
      --radius-card: 16px;
      --radius-control: 12px;
      --shadow-sheet: 0 -18px 54px rgba(0, 0, 0, .38);
    }

    * { box-sizing: border-box; }
    html { background: #071012; }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, #10201C 0, #071012 48rem);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; width: 20px; height: 20px; flex: 0 0 auto; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(168, 213, 186, .7); outline-offset: 2px; }

    .app-frame {
      position: relative;
      width: min(100%, 430px);
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--background);
      border-inline: 1px solid rgba(221, 242, 229, .09);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      z-index: 4;
      top: 0;
      height: calc(62px + env(safe-area-inset-top));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: env(safe-area-inset-top) 18px 10px;
      background: rgba(11, 19, 22, .96);
      border-bottom: 1px solid var(--border-soft);
      backdrop-filter: blur(14px);
    }
    .topbar-left { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .topbar h1 { max-width: 245px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; font-size: 19px; letter-spacing: -.025em; }
    .topbar-icon { color: var(--action); display: grid; place-items: center; }
    .topbar-icon svg { width: 23px; height: 23px; }
    .topbar-actions { display: flex; align-items: center; gap: 2px; }
    .icon-button {
      width: 42px; height: 42px; padding: 0; display: grid; place-items: center;
      color: var(--text-muted); background: none; border: 0; border-radius: 11px;
    }
    .icon-button:hover { color: var(--text); background: var(--surface-pressed); }
    .icon-button svg { width: 22px; height: 22px; }
    .notification-button { position: relative; }
    .notification-button::after { content: ""; position: absolute; top: 9px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--review); box-shadow: 0 0 0 2px var(--background); }

    .page {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 23px 18px 24px;
      scrollbar-width: none;
      animation: page-enter 180ms ease-out;
    }
    .page::-webkit-scrollbar { display: none; }
    @keyframes page-enter { from { opacity: .5; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .page-intro { margin-bottom: 23px; }
    .page-intro h2 { margin: 0 0 5px; font-size: 29px; line-height: 1.08; letter-spacing: -.047em; }
    .page-intro p { color: var(--text-muted); margin: 0; font-size: 14px; line-height: 1.42; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 25px 0 11px; }
    .section-title h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
    .section-title button { border: 0; background: none; color: var(--complete); font-weight: 760; font-size: 12px; padding: 6px 0; }

    .primary-button, .secondary-button {
      min-height: 46px; padding: 0 16px; border-radius: var(--radius-control); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: -.015em;
      white-space: nowrap;
    }
    .primary-button svg, .secondary-button svg { width: 17px; height: 17px; }
    .primary-button { color: #092515; background: var(--action); border: 1px solid var(--action); }
    .primary-button:hover { filter: brightness(1.05); }
    .secondary-button { color: var(--text); background: var(--surface); border: 1px solid var(--border); }
    .full { width: 100%; }

    .focus-card {
      border: 1px solid rgba(73, 209, 125, .38);
      border-radius: var(--radius-card);
      background: #123124;
      padding: 15px;
    }
    .focus-kicker { display: flex; align-items: center; gap: 7px; color: var(--complete); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .focus-kicker svg { width: 14px; height: 14px; }
    .focus-card h3 { margin: 8px 0 4px; font-size: 20px; letter-spacing: -.035em; }
    .focus-card p { margin: 0 0 13px; color: #BDD0C2; font-size: 13px; line-height: 1.35; }
    .focus-card .primary-button { width: 100%; }

    .daily-summary { display: flex; align-items: stretch; overflow: hidden; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card); }
    .daily-summary > div { flex: 1; padding: 13px 11px; min-width: 0; }
    .daily-summary > div + div { border-left: 1px solid var(--border-soft); }
    .daily-summary b { display: block; margin-bottom: 3px; font-size: 18px; letter-spacing: -.04em; }
    .daily-summary span { display: block; color: var(--text-muted); font-size: 11px; line-height: 1.18; }
    .daily-summary .amber { color: var(--review); }
    .daily-summary .mint { color: var(--complete); }
    .daily-summary .purple { color: var(--special); }

    .action-row, .content-row, .question-row, .track-row, .step-row {
      width: 100%; padding: 13px; text-align: left; color: var(--text); display: flex; align-items: center; gap: 12px; border: 1px solid var(--border-soft); background: var(--surface); border-radius: var(--radius-card);
    }
    .action-row:hover, .content-row:hover, .question-row:hover, .track-row:hover, .step-row:hover { background: var(--surface-pressed); border-color: var(--border); }
    .row-mark { flex: 0 0 38px; height: 38px; width: 38px; border-radius: 11px; display: grid; place-items: center; color: var(--complete); background: rgba(168, 213, 186, .11); }
    .row-mark svg { width: 19px; height: 19px; }
    .row-copy { min-width: 0; flex: 1; overflow: hidden; }
    .row-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 800; letter-spacing: -.015em; }
    .row-description { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; color: var(--text-muted); font-size: 12px; }
    .row-arrow { flex: 0 0 18px; color: var(--text-muted); }
    .row-arrow svg { width: 18px; height: 18px; }

    .bottom-nav {
      --active-index: 0;
      position: relative; z-index: 5; flex: 0 0 auto;
      min-height: calc(70px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 0 0 env(safe-area-inset-bottom);
      overflow: visible;
      border-top: 1px solid var(--border-soft);
      background: rgba(18, 32, 33, .98);
    }
    .nav-orb {
      pointer-events: none;
      position: absolute;
      z-index: 2;
      top: -17px;
      left: calc((var(--active-index) * 25%) + 12.5%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--action);
      box-shadow: 0 0 0 4px var(--background), 0 6px 14px rgba(0,0,0,.26);
      transition: left 360ms cubic-bezier(.22, 1, .36, 1);
    }
    .nav-button {
      position: relative; z-index: 3; min-width: 0; min-height: 65px; border: 0; background: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px 12px 9px 9px; font-size: 11px; transition: color 180ms ease, background 180ms ease;
    }
    .nav-button svg { height: 21px; width: 21px; transition: color 180ms ease, opacity 180ms ease; }
    .nav-button.active { color: var(--complete); background: none; }
    .nav-button.active svg { position: absolute; z-index: 3; top: -8px; left: 50%; width: 20px; height: 20px; transform: translateX(-50%); color: #0B2213; }
    .nav-button.active span { position: absolute; top: 39px; font-size: 10.5px; font-weight: 750; }

    .toolbar { display: flex; gap: 9px; align-items: center; margin-bottom: 16px; }
    .search-box { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 0; min-height: 46px; padding: 0 12px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-control); }
    .search-box input { width: 100%; min-width: 0; padding: 0; border: 0; color: var(--text); outline: 0; background: transparent; }
    .search-box input::placeholder { color: #84928B; }
    .filter-button { flex: 0 0 46px; width: 46px; min-height: 46px; border-radius: var(--radius-control); border: 1px solid rgba(232, 197, 106, .33); color: var(--review); background: rgba(232, 197, 106, .09); display: grid; place-items: center; }

    .tabs { display: flex; gap: 7px; overflow: auto; margin: 0 -1px 14px; padding: 1px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { min-height: 34px; white-space: nowrap; padding: 0 12px; border: 1px solid var(--border); border-radius: 9px; color: var(--text-muted); background: var(--surface); font-size: 12px; font-weight: 750; }
    .tab.active { color: #0B2113; border-color: var(--complete); background: var(--complete); }

    .card-list { display: grid; gap: 8px; }
    .flashcard {
      padding: 13px; border: 1px solid var(--border-soft); background: var(--surface); border-radius: var(--radius-card);
    }
    .flashcard-top { display: flex; align-items: flex-start; gap: 10px; }
    .flashcard .row-mark { flex-basis: 32px; width: 32px; height: 32px; border-radius: 9px; }
    .flashcard .row-title { padding-top: 1px; }
    .flashcard-answer { margin: 8px 0 10px 42px; color: var(--text-muted); font-size: 12px; line-height: 1.38; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .flashcard-footer { margin-left: 42px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .subtle-text { color: var(--text-muted); font-size: 11px; }
    .mini-menu { width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; color: var(--text-muted); background: none; }
    .mini-menu:hover { background: var(--surface-pressed); color: var(--text); }

    .state-label { flex: none; padding: 4px 7px; border-radius: 7px; font-size: 10px; font-weight: 850; line-height: 1.1; }
    .state-label.review { color: #261E06; background: var(--review); }
    .state-label.complete { color: #0C2717; background: var(--complete); }
    .state-label.special { color: #180E28; background: var(--special); }
    .state-label.neutral { color: #D8E1DC; background: #344246; }
    .state-label.current { color: #DAE7FF; background: #345789; }

    .question-row { align-items: flex-start; min-height: 84px; padding: 12px; }
    .question-number { display: grid; flex: 0 0 29px; width: 29px; height: 29px; place-items: center; border-radius: 8px; color: var(--review); background: rgba(232,197,106,.1); font-size: 11px; font-weight: 850; }
    .question-snippet { display: -webkit-box; margin: 5px 0 0; overflow: hidden; color: var(--text-muted); font-size: 12px; line-height: 1.34; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .question-row .row-title { white-space: normal; display: -webkit-box; overflow: hidden; line-height: 1.25; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .question-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--text-muted); font-size: 11px; }
    .tiny-dot { width: 7px; height: 7px; border-radius: 100%; }

    .track-row { gap: 13px; min-height: 84px; }
    .track-ring { --value: 3; position: relative; display: grid; flex: 0 0 52px; width: 52px; height: 52px; place-items: center; border-radius: 100%; background: conic-gradient(var(--complete) calc(var(--value) * 1%), #263934 0); }
    .track-ring::after { content: ""; position: absolute; inset: 5px; border-radius: 100%; background: var(--surface); }
    .track-ring b { position: relative; z-index: 1; color: var(--text); font-size: 12px; }
    .track-state { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; font-weight: 750; }
    .priority { width: 8px; height: 8px; border-radius: 50%; }
    .priority.action { background: var(--action); box-shadow: 0 0 0 4px rgba(73,209,125,.09); }
    .priority.review { background: var(--review); box-shadow: 0 0 0 4px rgba(232,197,106,.09); }
    .priority.special { background: var(--special); box-shadow: 0 0 0 4px rgba(185,161,245,.09); }

    .trail-header { margin-bottom: 19px; }
    .trail-breadcrumb { color: var(--text-muted); margin-bottom: 12px; font-size: 12px; }
    .trail-progress-line { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
    .trail-progress-line strong { font-size: 31px; letter-spacing: -.06em; }
    .trail-progress-line span { color: var(--text-muted); padding-bottom: 4px; font-size: 12px; }
    .progress-bar { height: 5px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: #273B36; }
    .progress-bar span { display: block; height: 100%; min-width: 4px; border-radius: inherit; background: var(--complete); }
    .step-list { display: grid; gap: 8px; }
    .step-row { position: relative; min-height: 62px; padding: 12px 35px 12px 12px; }
    .step-check { display: grid; flex: 0 0 26px; width: 26px; height: 26px; place-items: center; border: 2px solid #728982; border-radius: 50%; color: #728982; font-size: 10px; font-weight: 850; }
    .step-check svg { width: 14px; height: 14px; }
    .step-row.done .step-check { border-color: var(--complete); color: #092013; background: var(--complete); }
    .step-row.current { border-color: rgba(73,209,125,.52); background: #143025; }
    .step-row.current .step-check { border-color: var(--action); color: var(--action); }
    .step-row .state-label { margin-left: auto; }
    .step-row .priority { position: absolute; right: 15px; top: calc(50% - 4px); }
    .step-row.has-label { padding-right: 101px; }
    .step-row.has-label .state-label { position: absolute; right: 15px; top: calc(50% - 13px); }

    .empty-card { padding: 21px 16px; text-align: center; border: 1px dashed rgba(168,213,186,.34); border-radius: var(--radius-card); background: rgba(18,32,33,.5); }
    .empty-card .row-mark { margin: 0 auto 10px; }
    .empty-card h3 { margin: 0 0 5px; font-size: 15px; }
    .empty-card p { margin: 0 0 14px; color: var(--text-muted); font-size: 13px; line-height: 1.4; }

    .overlay { position: absolute; z-index: 10; inset: 0; display: none; align-items: flex-end; background: rgba(2, 7, 8, .67); backdrop-filter: blur(4px); }
    .overlay.open { display: flex; }
    .sheet {
      width: 100%; max-height: min(730px, calc(100% - 22px)); overflow: auto; padding: 11px 18px calc(18px + env(safe-area-inset-bottom)); border: 1px solid rgba(218,238,225,.18); border-radius: 24px 24px 0 0; background: #122021; box-shadow: var(--shadow-sheet); animation: lift .18s ease-out;
    }
    .dialog { align-self: center; margin: 18px; border-radius: 20px; padding-bottom: 18px; }
    @keyframes lift { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .grabber { width: 33px; height: 4px; margin: 0 auto 18px; border-radius: 99px; background: #70847B; }
    .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 17px; }
    .sheet-head h2 { margin: 0; font-size: 22px; letter-spacing: -.04em; }
    .sheet-head p { margin: 6px 0 0; color: var(--text-muted); font-size: 13px; line-height: 1.38; }
    .close-button { width: 38px; height: 38px; flex: 0 0 38px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 10px; background: none; color: var(--text-muted); }
    .close-button:hover { color: var(--text); background: var(--surface-pressed); }
    .field { margin: 13px 0; }
    .field label { display: block; margin: 0 0 7px; color: #D7E2DB; font-size: 12px; font-weight: 750; }
    .field small { color: var(--text-muted); font-weight: 500; }
    .field input, .field textarea, .field select { width: 100%; min-height: 45px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 11px; color: var(--text); background: #0D191A; outline: 0; }
    .field textarea { min-height: 78px; resize: vertical; line-height: 1.4; }
    .field input::placeholder, .field textarea::placeholder { color: #7D8D85; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--action); }
    .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 9px; margin-top: 19px; }
    .tip { display: flex; align-items: flex-start; gap: 9px; padding: 11px; color: #C7D9CD; border: 1px solid rgba(168,213,186,.22); border-radius: 11px; background: rgba(168,213,186,.08); font-size: 12px; line-height: 1.4; }
    .tip.review-tip { color: #EDDFB8; border-color: rgba(232,197,106,.23); background: rgba(232,197,106,.08); }
    .sheet-action { width: 100%; margin: 8px 0; }

    .sync-tabs { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 -3px 16px; border-bottom: 1px solid var(--border-soft); }
    .sync-tab { min-height: 39px; padding: 0 2px; border: 0; border-bottom: 3px solid transparent; color: var(--text-muted); background: none; font-size: 11px; font-weight: 780; }
    .sync-tab.active { border-color: var(--action); color: var(--complete); }
    .sync-section { display: none; }
    .sync-section.active { display: block; }
    .sync-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .sync-grid div { padding: 12px; border: 1px solid var(--border-soft); border-radius: 12px; background: #0E1B1C; }
    .sync-grid strong { display: block; margin-bottom: 3px; font-size: 18px; }
    .sync-grid span { color: var(--text-muted); font-size: 11px; }

    .toast { position: absolute; z-index: 14; right: 16px; bottom: 86px; left: 16px; display: none; padding: 12px 13px; color: #E9F4EC; border: 1px solid rgba(168,213,186,.34); border-radius: 12px; background: #183627; box-shadow: 0 10px 24px rgba(0,0,0,.28); font-size: 13px; }
    .toast.show { display: block; animation: lift .16s ease-out; }

    @media (min-width: 500px) {
      body { padding: 22px; }
      .app-frame { height: calc(100vh - 44px); min-height: 600px; border: 1px solid rgba(218,238,225,.13); border-radius: 24px; box-shadow: 0 30px 90px rgba(0,0,0,.38); }
      .topbar { border-radius: 24px 24px 0 0; }
      .bottom-nav { border-radius: 0 0 24px 24px; }
    }
    @media (max-width: 340px) {
      .page { padding-inline: 14px; }
      .page-intro h2 { font-size: 26px; }
      .field-pair { grid-template-columns: 1fr; gap: 0; }
      .track-row { padding: 11px; }
      .track-ring { flex-basis: 46px; width: 46px; height: 46px; }
      .step-row.has-label { padding-right: 94px; }
    }
  </style>
</head>
<body>
  <div class="app-frame" id="app"></div>
  <script>
    const I = {
      today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="15" rx="2.4"/><path d="M7.5 3v4M16.5 3v4M3.5 10h17M8 14h3M8 17h6"/></svg>',
      cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 5.4 15.8 3l3.2 12.4L8.2 18z"/><path d="m8.2 18 2 3L20.5 18 17.5 7"/></svg>',
      question: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="4" width="16.5" height="16" rx="2.3"/><path d="M8.5 9.3a3 3 0 1 1 5 2.25c-1.18.93-1.8 1.5-1.8 3M11.7 17h.01"/></svg>',
      route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 5h3a3 3 0 0 1 3 3v5a3 3 0 0 0 3 3h1"/></svg>',
      bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.3 4.3"/></svg>',
      filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M7 12h10M10 17h4"/><circle cx="8" cy="7" r="1.5" fill="currentColor"/><circle cx="15" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></svg>',
      plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>',
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
      dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.65"/><circle cx="12" cy="12" r="1.65"/><circle cx="19" cy="12" r="1.65"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 4.3 4.2L19 6.7"/></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.3 2"/></svg>',
      sync: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7v5h-5M4 17v-5h5M6 9a7 7 0 0 1 11.5-2M18 15a7 7 0 0 1-11.5 2"/></svg>',
      upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>'
    };
    const app = document.getElementById('app');
    let screen = 'today';
    let studyFilter = 'Todos';
    let navTransition = false;
    const icon = name => I[name];
    const action = name => `<button class="icon-button" aria-label="Ferramentas" onclick="openTools()">${icon('dots')}</button>`;

    function topbar(title, mark, right = '') {
      return `<header class="topbar"><div class="topbar-left"><span class="topbar-icon">${icon(mark)}</span><h1>${title}</h1></div><div class="topbar-actions">${right}<button class="icon-button notification-button" aria-label="Lembretes" onclick="openNotifications()">${icon('bell')}</button></div></header>`;
    }
    function navigation() {
      const entries = [['today','Hoje','today'],['study','Estudar','cards'],['questions','Questões','question'],['tracks','Trilhas','route']];
      const navScreen = screen === 'trackDetail' ? 'tracks' : screen;
      const activeIndex = entries.findIndex(([id]) => id === navScreen);
      return `<nav class="bottom-nav" style="--active-index:${activeIndex}" aria-label="Navegação principal"><i class="nav-orb" aria-hidden="true"></i>${entries.map(([id,label,mark]) => `<button class="nav-button ${navScreen === id ? 'active' : ''}" onclick="go('${id}')" aria-current="${navScreen === id ? 'page' : 'false'}">${icon(mark)}<span>${label}</span></button>`).join('')}</nav>`;
    }
    function pageIntro(title, text) { return `<header class="page-intro"><h2>${title}</h2><p>${text}</p></header>`; }
    function focus(title, text, handler, label) { return `<section class="focus-card"><div class="focus-kicker">${icon('play')} Próxima ação</div><h3>${title}</h3><p>${text}</p><button class="primary-button" onclick="${handler}">${icon('play')} ${label}</button></section>`; }
    function section(title, extra = '') { return `<div class="section-title"><h3>${title}</h3>${extra}</div>`; }
    function row(mark, title, description, handler, extra = '') { return `<button class="content-row" onclick="${handler}"><span class="row-mark">${icon(mark)}</span><span class="row-copy"><span class="row-title">${title}</span><span class="row-description">${description}</span></span>${extra || `<span class="row-arrow">${icon('arrow')}</span>`}</button>`; }

    function today() {
      return `${topbar('Hoje', 'today', action())}<main class="page">
        ${pageIntro('Seu estudo, em foco.', 'Uma próxima ação, depois o restante.')}
        ${focus('Revisar 3 flashcards', 'Dois cards venceram hoje. Uma sessão leva cerca de 6 minutos.', "go('study')", 'Estudar agora')}
        ${section('Resumo de hoje', '<button onclick="openNotifications()">Lembretes</button>')}
        <section class="daily-summary" aria-label="Resumo diário"><div><b class="amber">3</b><span>revisões<br>pendentes</span></div><div><b class="mint">8</b><span>itens<br>concluídos</span></div><div><b class="purple">25</b><span>minutos<br>estudados</span></div></section>
        ${section('Continue de onde parou', '<button onclick="go(\'tracks\')">Ver trilhas</button>')}
        ${row('route', 'Transpetro — análise de sistemas', 'Modelo OSI · próximo tópico', 'openTrackDetail()')}
        ${section('Fases de estudo', '<button onclick="openPhaseForm()">Criar fase</button>')}
        <section class="empty-card"><span class="row-mark">${icon('route')}</span><h3>Planeje a próxima etapa</h3><p>Uma fase organiza cards e tópicos em um objetivo de estudo.</p><button class="secondary-button" onclick="openPhaseForm()">Criar fase</button></section>
      </main>${navigation()}`;
    }

    function study() {
      const cards = [
        ['O que é independência de dados?', 'Capacidade de alterar um nível sem afetar os demais.', 'Vencido', 'review'],
        ['Como funciona o protocolo TCP?', 'É um protocolo orientado à conexão e confiável.', 'Novo', 'special'],
        ['Em qual camada atua o roteador?', 'O roteador opera principalmente na camada de rede.', 'Revisado', 'complete']
      ];
      return `${topbar('Estudar', 'cards', '<button class="icon-button" aria-label="Ações de flashcards" onclick="openStudyActions()">'+icon('dots')+'</button>')}<main class="page">
        ${pageIntro('Flashcards', 'Revisão espaçada, com uma sessão por vez.')}
        ${focus('3 cards para revisar', 'Comece pelos vencidos e mantenha o intervalo de revisão.', 'startStudy()', 'Revisar agora')}
        ${section('Seus cards', '<button onclick="openCardForm()">+ Novo</button>')}
        <div class="tabs">${['Todos','Vencidos','Novos','Difíceis','Revisados'].map(label => `<button class="tab ${studyFilter === label ? 'active' : ''}" onclick="setStudyFilter('${label}')">${label}</button>`).join('')}</div>
        <section class="card-list">${cards.map(([title,answer,status,tone]) => `<article class="flashcard"><div class="flashcard-top"><span class="row-mark">${icon('cards')}</span><span class="row-copy"><span class="row-title">${title}</span><span class="row-description">Redes de computadores</span></span><button class="mini-menu" aria-label="Ações do card" onclick="showToast('Editar, excluir e mover ficam neste menu.')">${icon('dots')}</button></div><p class="flashcard-answer">${answer}</p><footer class="flashcard-footer"><span class="subtle-text">Revisão hoje</span><span class="state-label ${tone}">${status}</span></footer></article>`).join('')}</section>
      </main>${navigation()}`;
    }

    function questions() {
      const data = [
        ['01', 'Qual é o total de endereços válidos em uma sub-rede /23?', 'Transpetro 2025 · Redes de computadores', 'Correta', 'complete'],
        ['02', 'Sobre o modelo OSI, assinale a alternativa incorreta.', 'Questão avulsa · Análise de sistemas', 'Revisar', 'review'],
        ['03', 'Qual protocolo atua na camada de transporte?', 'Transpetro 2025 · TCP/IP', 'Nova', 'special']
      ];
      return `${topbar('Questões', 'question', '<button class="icon-button" aria-label="Nova questão" onclick="openQuestionForm()">'+icon('plus')+'</button>')}<main class="page">
        ${pageIntro('Questões', 'Encontre, resolva e reveja seus erros.')}
        <div class="toolbar"><label class="search-box">${icon('search')}<input placeholder="Buscar questões" aria-label="Buscar questões" /></label><button class="filter-button" aria-label="Filtros" onclick="openQuestionFilters()">${icon('filter')}</button></div>
        ${focus('10 questões de redes', 'Modelo OSI é o assunto que merece prática agora.', "showToast('Sessão de questões iniciada.')", 'Praticar agora')}
        ${section('Questões recentes', '<button onclick="openQuestionActions()">Ações</button>')}
        <section class="card-list">${data.map(([number,title,meta,status,tone]) => `<button class="question-row" onclick="openQuestionDetail('${number}')"><span class="question-number">${number}</span><span class="row-copy"><span class="row-title">${title}</span><span class="question-snippet">${meta}</span><span class="question-meta"><i class="tiny-dot" style="background:var(--${tone === 'complete' ? 'complete' : tone === 'review' ? 'review' : 'special'})"></i>${status}</span></span><span class="row-arrow">${icon('arrow')}</span></button>`).join('')}</section>
      </main>${navigation()}`;
    }

    function tracks() {
      const data = [
        ['Transpetro', '2/578 itens concluídos', 3, 'Em andamento', 'action'],
        ['Direito administrativo', '12/86 itens concluídos', 14, 'Revisar', 'review'],
        ['Banco de dados', '32/48 itens concluídos', 67, 'Quase concluída', 'special']
      ];
      return `${topbar('Trilhas', 'route', '<button class="icon-button" aria-label="Importar trilha" onclick="openTrackImport()">'+icon('upload')+'</button><button class="icon-button" aria-label="Nova trilha" onclick="openTrackForm()">'+icon('plus')+'</button>')}<main class="page">
        ${pageIntro('Minhas trilhas', 'Continue de onde parou.')}
        ${focus('Modelo OSI', 'Transpetro · próximo tópico · 0 de 12 itens concluídos.', 'openTrackDetail()', 'Continuar estudando')}
        ${section('Suas trilhas', '<button onclick="openTrackForm()">+ Nova</button>')}
        <section class="card-list">${data.map(([title,items,percent,status,tone]) => `<button class="track-row" onclick="openTrackDetail()"><span class="track-ring" style="--value:${percent}"><b>${percent}%</b></span><span class="row-copy"><span class="row-title">${title}</span><span class="row-description">${items}</span><span class="track-state" style="color:var(--${tone === 'action' ? 'action' : tone})"><i class="priority ${tone}"></i>${status}</span></span><span class="row-arrow">${icon('arrow')}</span></button>`).join('')}</section>
      </main>${navigation()}`;
    }

    function trackDetail() {
      const steps = [
        ['done', 'Introdução à análise de sistemas', '8/8 itens concluídos', 'Concluído', 'complete', ''],
        ['current', 'Redes de computadores', 'Modelo OSI · próximo tópico', 'Em andamento', 'current', 'action'],
        ['', 'Banco de dados', '2/18 itens concluídos', 'A fazer', 'neutral', ''],
        ['', 'Segurança da informação', '4/16 itens · revisar depois', 'Revisar', 'review', 'review'],
        ['', 'Programação', '7/24 itens concluídos', 'A fazer', 'neutral', 'special']
      ];
      return `${topbar('Transpetro', 'route', '<button class="icon-button" aria-label="Voltar para trilhas" onclick="go(\'tracks\')">'+icon('back')+'</button>')}<main class="page">
        <section class="trail-header"><div class="trail-breadcrumb">Parte 1 · Ênfase — Análise de sistemas</div><div class="trail-progress-line"><strong>3%</strong><span>17 de 578 itens</span></div><div class="progress-bar"><span style="width:3%"></span></div></section>
        ${section('Etapas', '<button onclick="showToast(\'Ações de ordenação abertas.\')">Ordenar</button>')}
        <section class="step-list">${steps.map(([type,title,detail,label,tone,priority]) => `<button class="step-row ${type} ${priority ? '' : 'has-label'}" onclick="showToast('${title} aberto.')"><span class="step-check">${type === 'done' ? icon('check') : type === 'current' ? '02' : '○'}</span><span class="row-copy"><span class="row-title">${title}</span><span class="row-description">${detail}</span></span><span class="state-label ${tone}">${label}</span>${priority ? `<i class="priority ${priority}"></i>` : ''}</button>`).join('')}</section>
      </main>${navigation()}`;
    }

    function shell() {
      const pages = { today, study, questions, tracks, trackDetail };
      app.innerHTML = pages[screen]();
      app.insertAdjacentHTML('beforeend', '<section id="overlay" class="overlay" aria-live="polite"></section><div id="toast" class="toast" role="status"></div>');
    }
    function go(next) {
      const destinations = ['today', 'study', 'questions', 'tracks'];
      const nextIndex = destinations.indexOf(next);
      const nav = app.querySelector('.bottom-nav');
      if (nextIndex < 0 || !nav || screen === next) { screen = next; shell(); return; }
      if (navTransition) return;

      navTransition = true;
      nav.style.setProperty('--active-index', nextIndex);
      window.setTimeout(() => {
        nav.querySelectorAll('.nav-button').forEach((button, index) => {
          const selected = index === nextIndex;
          button.classList.toggle('active', selected);
          button.setAttribute('aria-current', selected ? 'page' : 'false');
        });
      }, 150);
      window.setTimeout(() => { screen = next; navTransition = false; shell(); }, 370);
    }
    function setStudyFilter(filter) { studyFilter = filter; shell(); }

    function openSheet(html, dialog = false) {
      const overlay = document.getElementById('overlay');
      overlay.innerHTML = `<section class="sheet ${dialog ? 'dialog' : ''}" role="dialog" aria-modal="true">${html}</section>`;
      overlay.classList.add('open');
    }
    function closeSheet() { const overlay = document.getElementById('overlay'); if (overlay) { overlay.classList.remove('open'); overlay.innerHTML = ''; } }
    function sheetHead(title, description) { return `<div class="grabber"></div><header class="sheet-head"><div><h2>${title}</h2><p>${description}</p></div><button class="close-button" aria-label="Fechar" onclick="closeSheet()">${icon('close')}</button></header>`; }
    function showToast(message) { const toast = document.getElementById('toast'); if (!toast) return; toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2600); }

    function openTools() {
      openSheet(`${sheetHead('Ferramentas', 'Recursos do aplicativo fora da navegação principal.')}
        ${row('sync', 'Sincronizar dados', 'QR Code, pacotes e backups', 'openSync()')}
        ${row('filter', 'Configurações', 'Lembretes e preferências', "showToast('Configurações abertas.');closeSheet()")}`);
    }
    function openNotifications() {
      openSheet(`${sheetHead('Lembretes', 'Seu plano para hoje, reunido em um só lugar.')}
        <section class="tip review-tip">${icon('clock')}<span><b>3 cards aguardam revisão.</b><br>Comece pelos dois vencidos para preservar o ritmo.</span></section>
        <section class="tip" style="margin-top:10px">${icon('today')}<span><b>Lembrete diário às 19:00.</b><br>Você pode mudar esse horário quando quiser.</span></section>
        <div class="modal-actions"><button class="secondary-button" onclick="showToast('Horário do lembrete aberto.');closeSheet()">Configurar</button><button class="primary-button" onclick="go('study');closeSheet()">Revisar agora</button></div>`);
    }
    function openStudyActions() {
      openSheet(`${sheetHead('Flashcards', 'Ferramentas sem poluir a tela de estudo.')}
        ${row('route', 'Progresso', 'Metas, sequência e desempenho', "showToast('Progresso aberto.');closeSheet()")}
        ${row('clock', 'Histórico', 'Respostas e revisões anteriores', "showToast('Histórico aberto.');closeSheet()")}
        ${row('filter', 'Configurar revisão', 'Quantidade e ordem dos cards', "showToast('Configuração de revisão aberta.');closeSheet()")}`);
    }
    function openCardForm() {
      openSheet(`${sheetHead('Novo flashcard', 'Pergunta e resposta primeiro. Vínculos são opcionais.')}
        <div class="field"><label>Pergunta</label><textarea placeholder="Frente do flashcard"></textarea></div>
        <div class="field"><label>Resposta</label><textarea placeholder="Resposta curta e fácil de revisar"></textarea></div>
        <div class="field"><label>Material vinculado <small>(opcional)</small></label><input placeholder="Buscar questão ou tópico" /></div>
        <div class="modal-actions"><button class="secondary-button" onclick="closeSheet()">Cancelar</button><button class="primary-button" onclick="closeSheet();showToast('Flashcard criado.')">Criar card</button></div>`);
    }
    function startStudy() { showToast('Sessão de 3 cards iniciada.'); }

    function openQuestionFilters() {
      openSheet(`${sheetHead('Filtrar questões', 'A busca fica na tela; os filtros avançados ficam aqui.')}
        <div class="field"><label>Prova ou vaga</label><select><option>Todas</option><option>Transpetro 2025</option><option>Questões avulsas</option></select></div>
        <div class="field-pair"><div class="field"><label>Banca</label><select><option>Todas</option><option>CESPE</option></select></div><div class="field"><label>Ano</label><select><option>Todos</option><option>2025</option></select></div></div>
        <div class="field"><label>Assunto</label><select><option>Todos</option><option>Redes</option><option>Banco de dados</option></select></div>
        <div class="modal-actions"><button class="secondary-button" onclick="closeSheet();showToast('Filtros limpos.')">Limpar</button><button class="primary-button" onclick="closeSheet();showToast('Filtros aplicados.')">Aplicar</button></div>`);
    }
    function openQuestionActions() {
      openSheet(`${sheetHead('Gerenciar questões', 'Importação e cadastro em massa sem empilhar botões na página.')}
        ${row('plus', 'Nova questão', 'Cadastre uma questão individual', 'openQuestionForm()')}
        ${row('download', 'Cadastro em massa', 'Cole questões e revise a prévia', "closeSheet();showToast('Cadastro em massa aberto.')")}
        ${row('upload', 'Importar PDF', 'Prova e gabarito', "closeSheet();showToast('Importação de PDF aberta.')")}`);
    }
    function openQuestionForm() {
      openSheet(`${sheetHead('Nova questão', 'Comece pela prova e pelo enunciado.')}
        <div class="field"><label>Prova <small>(opcional)</small></label><select><option>Questão avulsa</option><option>Transpetro 2025 — Analista</option></select></div>
        <div class="field"><label>Enunciado</label><textarea placeholder="Digite ou cole a questão"></textarea></div>
        <div class="field"><label>Alternativas</label><textarea placeholder="A) ...\nB) ...\nC) ..."></textarea></div>
        <div class="field-pair"><div class="field"><label>Gabarito</label><select><option>Selecione</option><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Assunto <small>(opcional)</small></label><input placeholder="Ex.: Redes" /></div></div>
        <div class="modal-actions"><button class="secondary-button" onclick="closeSheet()">Cancelar</button><button class="primary-button" onclick="closeSheet();showToast('Questão criada.')">Salvar</button></div>`);
    }
    function openQuestionDetail(number) {
      openSheet(`${sheetHead('Questão ' + number, 'Transpetro 2025 · Redes de computadores')}
        <section class="tip">${icon('info')}<span>Na versão final, este espaço comporta enunciado, alternativas, resolução e feedback, com leitura confortável.</span></section>
        <div class="modal-actions"><button class="secondary-button" onclick="closeSheet()">Fechar</button><button class="primary-button" onclick="closeSheet();showToast('Questão iniciada.')">Resolver</button></div>`, true);
    }

    function openTrackForm() {
      openSheet(`${sheetHead('Nova trilha', 'Crie uma trilha curta ou adicione etapas em massa.')}
        <div class="tabs"><button class="tab active">Criar trilha</button><button class="tab" onclick="showToast('A criação em massa abriria nesta mesma folha.')">Em massa</button></div>
        <div class="field"><label>Nome da trilha</label><input placeholder="Ex.: Transpetro" /></div>
        <div class="field"><label>Descrição <small>(opcional)</small></label><textarea placeholder="Objetivo desta trilha"></textarea></div>
        <div class="modal-actions"><button class="secondary-button" onclick="closeSheet()">Cancelar</button><button class="primary-button" onclick="closeSheet();showToast('Trilha criada.')">Criar trilha</button></div>`);
    }
    function openTrackImport() {
      openSheet(`${sheetHead('Importar trilha', 'Traga um arquivo ou cole etapas estruturadas.')}
        ${row('upload', 'Importar arquivo', 'Trilha exportada do Dunots', "closeSheet();showToast('Seletor de arquivo aberto.')")}
        ${row('download', 'Colar etapas', 'Formato de criação em massa', "closeSheet();showToast('Criação em massa aberta.')")}`);
    }
    function openPhaseForm() {
      openSheet(`${sheetHead('Nova fase de estudo', 'Agrupe cards e tópicos em um objetivo.')}
        <div class="field"><label>Nome da fase</label><input placeholder="Ex.: Fundamentos de redes" /></div>
        <section class="tip">${icon('info')}<span>Depois de criar a fase, você seleciona os cards e tópicos que pertencem a ela.</span></section>
        <div class="modal-actions"><button class="secondary-button" onclick="closeSheet()">Cancelar</button><button class="primary-button" onclick="closeSheet();showToast('Fase criada.')">Criar fase</button></div>`);
    }

    function openSync() {
      openSheet(`${sheetHead('Sincronizar dados', 'Transfira seus dados com revisão antes de mesclar.')}
        <nav class="sync-tabs"><button class="sync-tab active" onclick="syncTab('pair', this)">QR Code</button><button class="sync-tab" onclick="syncTab('export', this)">Exportar</button><button class="sync-tab" onclick="syncTab('import', this)">Importar</button><button class="sync-tab" onclick="syncTab('backup', this)">Backups</button></nav>
        <section class="sync-section active" id="sync-pair"><section class="tip">${icon('sync')}<span>Leia o QR Code do Desktop ou cole o código. O token é temporário e a sessão expira.</span></section><div class="field"><label>Código de pareamento</label><input placeholder="Cole ou escaneie o código" /></div><button class="primary-button full" onclick="showToast('Procurando o outro dispositivo...')">${icon('download')} Receber dados</button></section>
        <section class="sync-section" id="sync-export"><section class="tip">${icon('upload')}<span>Gere um pacote .dunots para transferir suas coleções.</span></section><button class="primary-button full" style="margin-top:13px" onclick="showToast('Pacote preparado para exportação.')">${icon('upload')} Gerar pacote</button></section>
        <section class="sync-section" id="sync-import"><section class="sync-grid"><div><strong>840</strong><span>novos</span></div><div><strong>2</strong><span>conflitos</span></div><div><strong>0</strong><span>exclusões</span></div><div><strong>2</strong><span>indisponíveis</span></div></section><button class="primary-button full" onclick="showToast('Prévia de mesclagem aberta.')">Revisar e aplicar</button></section>
        <section class="sync-section" id="sync-backup"><section class="tip review-tip">${icon('info')}<span>Um backup é criado antes de cada mesclagem. Restaurar é sempre uma ação explícita.</span></section><button class="secondary-button full" style="margin-top:13px" onclick="showToast('Lista de backups aberta.')">Ver backups</button></section>`);
    }
    function syncTab(id, node) {
      document.querySelectorAll('.sync-tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.sync-section').forEach(x => x.classList.remove('active'));
      node.classList.add('active'); document.getElementById('sync-' + id).classList.add('active');
    }

    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSheet(); });
    shell();
    Object.assign(window, { go, setStudyFilter, openTools, openNotifications, openStudyActions, openCardForm, startStudy, openQuestionFilters, openQuestionActions, openQuestionForm, openQuestionDetail, openTrackForm, openTrackImport, openPhaseForm, openTrackDetail: () => go('trackDetail'), openSync, syncTab, closeSheet, showToast });
  </script>
</body>
</html>
